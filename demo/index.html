  <body>
    <main id="demo">
      <noscript>
        <h1>Fax</h1>
        <p>
          An FFGL effect that sends your clip as a Group 3 fax (ITU-T T.4) down
          a noisy phone line. Each scan line gets thresholded or halftoned to
          black and white, coded by a proper Modified Huffman or Modified READ
          coder, sent down a line that flips bits, and decoded at the other end,
          so the glitches are the ones a real fax makes. A bit error streaks
          along its line to the right edge and stops, in MR it smears down as a
          wedge to the next one-dimensional line, a receiver that spots a bad
          line repeats the one above, and in Page mode the page creeps in line
          by line at the baud rate, exactly as slowly as you remember.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/fax">its repository</a>.
        </p>
