name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # FAX_BUILD_TOOLS is ON here where the release build turns it OFF:
        # fxtest is the only place the claims are written down as a number,
        # so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DFAX_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/fxtest --list

      - name: Checks
        # The runner has no accelerated GL; the harness falls back to Apple's
        # software renderer, which is not repeatable at the last bit. Every
        # check here was written to hold at any raster and on that renderer
        # (verify.sh runs them with FXTEST_RENDERER=software locally): the
        # codec checks compare bits, the picture checks allow one 8-bit step,
        # the scan leaves out pels whose decision hangs on float rounding,
        # and the timing is read off the receiver's page at 2 ms steps.
        timeout-minutes: 30
        run: |
          ./build/fxtest --names
          ./build/fxtest --tables
          ./build/fxtest --roundtrip --size 320x180
          ./build/fxtest --scan      --size 320x180
          ./build/fxtest --print     --size 320x180
          ./build/fxtest --streak    --size 320x180
          ./build/fxtest --wedge     --size 320x180
          ./build/fxtest --conceal   --size 320x180
          ./build/fxtest --timing    --size 320x180
          ./build/fxtest --resize    --size 320x180
          ./build/fxtest --negative  --size 320x180

      - name: Controls
        # At 160x90 and two at a time, because the runner has no GPU and the
        # question is only whether a control changed ANY subpixel. Graticule's
        # first run of this step at 320x180 was still going at twenty minutes.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 160x90 --jobs 2

      - uses: actions/upload-artifact@v4
        with:
          name: fax-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DFAX_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: fax-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
